
name: MyHTMLApp

options:
  bundleIdPrefix: com.example

targets:
  MyHTMLApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ContentView.swift
    resources:
      - path: index.html
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myhtmlapp
        PRODUCT_NAME: MyHTMLApp
        INFOPLIST_KEY_CFBundleDisplayName: MyHTMLApp
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
