    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: Assets.xcassets
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: iZiP
