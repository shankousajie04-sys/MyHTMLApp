name: MyHTMLApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
targets:
  MyHTMLApp:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        INFOPLIST_KEY_CFBundleDisplayName: iZip
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIP Archive
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - com.pkware.zip-archive
