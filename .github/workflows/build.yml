
name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild build \
            -project MyHTMLApp.xcodeproj \
            -scheme MyHTMLApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MyHTMLApp.app Payload/
          zip -r MyHTMLApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MyHTMLApp-IPA
          path: MyHTMLApp.ipa
